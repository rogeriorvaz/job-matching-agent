application:
  name: Local Job Matching Agent
  database: data/jobs.db
  log_level: INFO

search:
  location: London
  time_window_hours: 24
  minimum_score: 7
  maximum_results: 10

llm:
  base_url: http://localhost:11434/v1
  model: CHANGE_ME
  temperature: 0.1
  timeout_seconds: 120

collection:
  headless: true
  page_timeout_ms: 30000
  request_delay_seconds: 2
